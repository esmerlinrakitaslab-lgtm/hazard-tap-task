<style>

}

<div id="app"></div>
<div id="notice" hidden></div>
<div id="stage" hidden>
  <button class="stage-x" data-act="hostStop" aria-label="Stop and go back">&times;</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
/* ====================================================================
   SETTINGS: the group edits this block, then reuses the same file everywhere.
   All times are in seconds. Hazard and message times count from the start
   of the footage (not from the white flash).
   After any edit, open the projector page: the "Settings check" box lists
   any mistakes it finds (overlaps, times past the end, unbalanced sets).
   ==================================================================== */
// Message wording. Keep every message unrelated to the road. Each needs two replies.
// Messages are used in time order, one after another, for each set.
const MSG=[
  {from:'Sam',text:'Are you free later today?',replies:['Yes','No']},
  {from:'Sam',text:'Did you eat yet?',replies:['Yes','No']},
  {from:'Sam',text:'Want to get coffee after?',replies:['Sure',"Can't"]},
  {from:'Sam',text:'Did you finish the reading?',replies:['Yes','Not yet']},
  {from:'Sam',text:'Can you send me the notes?',replies:['Okay','Later']},
  {from:'Sam',text:'Are you coming to the meeting?',replies:['Yes','No']},
  {from:'Sam',text:'Is it cold where you are?',replies:['Yes','No']},
  {from:'Sam',text:'Need anything from the store?',replies:['Yes','No']},
  {from:'Sam',text:'Did you see my last message?',replies:['Yes','No']},
  {from:'Sam',text:'Call me when you can?',replies:['Okay','Later']},
  {from:'Sam',text:'Did you get my email?',replies:['Yes','No']},
  {from:'Sam',text:'Are we still on for Friday?',replies:['Yes','Maybe']},
  {from:'Sam',text:'Can I borrow your charger?',replies:['Sure','No']},
  {from:'Sam',text:'What time is class tomorrow?',replies:['9 am','Not sure']},
  {from:'Sam',text:'Did you watch the game?',replies:['Yes','No']},
  {from:'Sam',text:'Pizza or tacos tonight?',replies:['Pizza','Tacos']}
];
// Google Sheet that stores results. Paste the Web app link from Apps Script here (it ends in /exec).
// Leave it as '' and phones show a results code to copy instead.
const SHEET_URL='https://script.google.com/macros/s/AKfycbyfO5YoWfg4EeJXdkAlVjZnCIJmMR77lhVTx_1-8InNFI97H-q-Ef8iSEV07Og5TB_0/exec';
// Link participants open (shown as a QR code on the projector page). Put your hosted link here,
// for example 'https://your-site.netlify.app/'. Leave it as '' to use the address the projector laptop has open.
const PAGE_URL='';
const sched=times=>times.slice().sort((x,y)=>x-y).map((t,i)=>Object.assign({t:t},MSG[i%MSG.length]));
/* Which video and block design the class session uses. It must match the video file you load.
   '2332'  2 min no phone, 3 min phone, 3 min no phone, 2 min phone (everyone the same order)
   '55'    5 min + 5 min: odd numbers get the phone block first, even numbers get it second
   Blocks are [start, end, phone] with phone 1 = messages arrive, 0 = no messages.
   joins are the times where two pieces of the drive meet in the video (no hazards near them). */
const DESIGN='2332';
const DESIGNS={
  '2332':{
    label:'Class session (2-3-3-2)',
    video:'hazard_video_2332.mp4',
    footageLength:600,
    joins:[120,300,480],
    // Hazard start times estimated by Claude from the frames. Have two coders check them.
    hazards:[29.9,69.0,134.4,265.5,378.4,456.8,504.0,579.4],
    blocks:{A:[[0,120,0],[120,300,1],[300,480,0],[480,600,1]],
            B:[[0,120,0],[120,300,1],[300,480,0],[480,600,1]]},
    // Messages only in phone blocks, about every 25 s; 4 of them arrive 1.5 s before a hazard.
    messages:{A:[132.9,160,188,214,240,264,288, 486,502.5,528,552,577.9],
              B:[132.9,160,188,214,240,264,288, 486,502.5,528,552,577.9]}
  },
  '55':{
    label:'Class session (5+5)',
    video:'hazard_video_55.mp4',
    footageLength:600,
    joins:[300],
    hazards:[31.9,106.9,219.8,282.1,319.8,427.0,452.0,589.0],
    blocks:{A:[[0,300,1],[300,600,0]],     // odd numbers: phone first
            B:[[0,300,0],[300,600,1]]},    // even numbers: phone second
    messages:{A:[10,30.4,55,80,105.4,130,155,180,200,218.3,245,262,280.6],
              B:[306,318.3,345,370,395,425.5,450.5,475,500,525,545,565,587.5]}
  }
};
const DZ=DESIGNS[DESIGN];
const MODES={
  real:{
    label:DZ.label,
    video:DZ.video,
    joins:DZ.joins,
    blocks:DZ.blocks,
    draft:true,               // Change to false after two coders confirm the hazard times.
    leadIn:5,                 // seconds between the white flash and the first frame of footage
    footageLength:DZ.footageLength,   // the projector page checks this against the video file
    familiarize:0,
    hazards:DZ.hazards,
    hitWindow:[0.2,3.0],      // a tap counts as "found" this long after a hazard starts
    noticeSeconds:6,          // how long each message stays on screen if not answered
    schedules:{A:sched(DZ.messages.A),B:sched(DZ.messages.B)}   // A = odd numbers, B = even numbers
  },
  rehearsal:{
    label:'Rehearsal',
    leadIn:2,footageLength:40,familiarize:0,hazards:[8,17,28,36],hitWindow:[0.2,3.0],noticeSeconds:6,
    blocks:{A:[[0,20,0],[20,40,1]],B:[[0,20,1],[20,40,0]]},
    schedules:{A:sched([24,32]),B:sched([4,12])}
  }
};
/* ==================================================================== */

/* Is time t inside a phone block for this set? Without blocks, "phone" means a message is on screen. */
function phoneAt(c,set,t){
  if(c.blocks)return (c.blocks[set]||[]).some(b=>b[2]&&t>=b[0]&&t<b[1]);
  return (c.schedules[set]||[]).some(m=>t>=m.t&&t<=m.t+c.noticeSeconds);
}
/* Settings check: plain-language warnings shown on the projector page. */
function checkSettings(c){
  const out=[],warn=t=>out.push({bad:true,t:t}),ok=t=>out.push({bad:false,t:t});
  const H=c.hazards,L=c.footageLength,w=c.hitWindow;
  if(c.draft)warn('These are draft timings. Replace them with your marked hazard times, then set draft to false.');
  if(!(w[0]>=0&&w[1]>w[0]))warn('The hit window should be two numbers, the first smaller than the second.');
  for(let i=1;i<H.length;i++)if(H[i]<=H[i-1])warn('Hazard times must go from earliest to latest (check hazard '+(i+1)+').');
  const F=c.familiarize||0;
  H.forEach((h,i)=>{if(F&&h<F)warn('Hazard '+(i+1)+' starts at '+h+' s, inside the first '+F+' s, which should have no hazards.')});
  H.forEach((h,i)=>{if(h<0||h+w[1]>L)warn('Hazard '+(i+1)+' at '+h+' s is too close to the end or outside the footage ('+L+' s).')});
  for(let i=1;i<H.length;i++)if(H[i]-H[i-1]<=w[1]+1)warn('Hazards '+i+' and '+(i+1)+' are only '+r3(H[i]-H[i-1])+' s apart. A tap could count for the wrong one. Keep them more than '+(w[1]+1)+' s apart.');
  const sets={};
  ['A','B'].forEach(k=>{
    const l=c.schedules[k]||[];
    l.forEach((m,i)=>{
      if(F&&m.t<F)warn('Set '+k+' message '+(i+1)+' at '+m.t+' s is inside the first '+F+' s, which should have no messages.');
      if(m.t<0||m.t+c.noticeSeconds>L)warn('Set '+k+' message '+(i+1)+' at '+m.t+' s is outside the footage.');
      if(i>0&&m.t<l[i-1].t+c.noticeSeconds)warn('Set '+k+' messages '+i+' and '+(i+1)+' overlap. Keep them at least '+c.noticeSeconds+' s apart.');
      if(!m.replies||m.replies.length!==2)warn('Set '+k+' message '+(i+1)+' needs exactly two reply buttons.');
    });
    const paired=l.filter(m=>H.some(h=>h>=m.t&&h<=m.t+c.noticeSeconds)).length;
    sets[k]={n:l.length,paired:paired,withMsg:H.map(h=>l.some(m=>h>=m.t&&h<=m.t+c.noticeSeconds))};
    if(c.blocks){
      l.forEach((m,i)=>{if(!phoneAt(c,k,m.t)||!phoneAt(c,k,m.t+c.noticeSeconds-0.01))warn('Set '+k+' message '+(i+1)+' at '+m.t+' s is not fully inside a phone block.')});
      const ph=H.filter(h=>phoneAt(c,k,h)).length,np=H.length-ph;
      if(Math.abs(ph-np)>1)warn('Set '+k+' has '+ph+' hazards in phone blocks and '+np+' in no-phone blocks. These should be about equal.');
    }
    if(!c.blocks&&l.length&&paired===l.length&&modeKey==='real')warn('In set '+k+' every message comes right before a hazard. Participants may learn that a message means a hazard is coming. Add some filler messages away from hazards.');
  });
  (c.joins||[]).forEach(j=>H.forEach((h,i)=>{if(Math.abs(h-j)<5)warn('Hazard '+(i+1)+' at '+h+' s is within 5 s of the join at '+j+' s. The cut itself could look like an event.')}));
  if(!H.length)warn('No hazard times are set for this design yet.');
  const both=c.blocks?0:H.filter((h,i)=>sets.A.withMsg[i]&&sets.B.withMsg[i]).length;
  const nA=sets.A.withMsg.filter(Boolean).length,nB=sets.B.withMsg.filter(Boolean).length;
  if(both)warn(both+' hazard(s) have a message in both sets. For a fair comparison each hazard should have a message in only one set.');
  if(!c.blocks&&nA!==nB)warn('Set A has '+nA+' hazards with a message, set B has '+nB+'. These should match.');
  if(!out.some(x=>x.bad))ok('No problems found in these settings.');
  return out;
}

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sleepUntil=t=>sleep(Math.max(0,t-performance.now()));
const r3=x=>Math.round(x*1000)/1000;
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const num=(x,d)=>x==null?'':Number(x).toFixed(d||0);
const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const b64u=s=>b64(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
/* A short fingerprint of the timings, so the results tab can tell if a code was made with different settings. */
function settingsKey(mode){
  const c=MODES[mode];if(!c)return '';
  const s=JSON.stringify([c.footageLength,c.leadIn,c.hazards,c.hitWindow,c.noticeSeconds,c.schedules.A.map(m=>m.t),c.schedules.B.map(m=>m.t)]);
  let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

let modeKey='real';
const cfg=()=>MODES[modeKey];
const S={screen:'landing',pid:null,seat:'',schedule:'A',readyAt:null,tc:null,syncLag:null,taps:[],msgs:[],timer:null,wake:null,left:[],code:'',practice:0,hostTab:'run',hostFile:null,hostInfo:'',hostWarn:'',payload:null,lastSave:0,fileName:''};
let collected=[];
try{collected=JSON.parse(store.get('htt-collected')||'[]')||[]}catch(e){collected=[]}
const saveCollected=()=>store.set('htt-collected',JSON.stringify(collected));
const loadJSON=(k,d)=>{try{const v=JSON.parse(store.get(k)||'null');return v==null?d:v}catch(e){return d}};

/* Problems a participant can report at the end. */
const ISSUES=[
  ['late','I missed the white flash or tapped the blue button late'],
  ['lock','My screen locked or my phone went to sleep'],
  ['away','I left the page or switched to another app'],
  ['reload','The page reloaded, closed, or my phone died'],
  ['sound','I could not see the screen or hear well at some point']
];
const ISSUE_SHORT={late:'late start',lock:'screen locked',away:'left page',reload:'page reloaded or phone died',sound:'could not see or hear'};

/* The run in progress is saved on the phone, so a reload or crash still leaves a partial code. */
function saveRun(ft){
  S.lastSave=ft;
  store.set('htt-run',JSON.stringify({pid:S.pid,schedule:S.schedule,seat:S.seat,mode:modeKey,syncLag:S.syncLag,
    taps:S.taps,msgs:S.msgs,left:S.left,lastFt:r3(ft),sid:S.sid}));
}

/* ---------------- rendering ---------------- */
const app=$('#app');
let rendering=false;
function render(){
  // Redrawing removes the focused box, which can fire a change event that asks for another redraw.
  if(rendering)return;rendering=true;
  try{draw()}finally{rendering=false}
}
function draw(){
  const f=VIEW[S.screen]; app.innerHTML=f();
  if(S.screen==='front')bindFront();
  if(S.screen==='end')bindEnd();
  if(S.screen==='host'&&S.hostTab==='run')drawQR($('#qr'),pageUrl(),160);
  window.scrollTo(0,0);
}
function go(name){S.screen=name;render()}

const modeSeg=()=>`<div class="seg" role="group" aria-label="Timings">
  <button type="button" data-act="mode" data-m="real" aria-pressed="${modeKey==='real'}">Class session</button>
  <button type="button" data-act="mode" data-m="rehearsal" aria-pressed="${modeKey==='rehearsal'}">Rehearsal (short)</button></div>`;

const VIEW={
landing(){
  const last=store.get('htt-last'),run=store.get('htt-run');
  return `<main class="wrap center">
    <h1>Hazard Tap Task</h1>
    <p class="muted">A classroom attention study. Pick your role.</p>
    ${run?`<section class="card"><h2>Your session stopped early</h2>
      <p class="small muted">This phone has taps saved from a session that did not finish. Get your partial results code and send it to the researchers. Do not start again.</p>
      <button class="btn primary big" data-act="partial">Get my partial results code</button></section>`:''}
    ${run?`<details><summary>Start a new session on this phone</summary><div class="field" style="margin-top:12px">

/* ---------------- participant flow ---------------- */
function bindFront(){
  const c=$('#consent'),p=$('#pid'),g=$('#frontGo');
  const check=()=>{const n=Number(p.value);g.disabled=!(c.checked&&Number.isInteger(n)&&n>=1&&n<=99)};

function pageUrl(){return PAGE_URL||String(location.href).split('#')[0].split('?')[0]}
function pageUrlWarn(){
  if(PAGE_URL)return '';
  if(location.protocol==='file:')return 'This page is open from a file, so phones cannot use this link. Put your hosted link in PAGE_URL in the settings.';
  if(/claude/i.test(location.hostname))return 'This is a preview address that classmates may not be able to open. Put your hosted link in PAGE_URL in the settings.';

}
function drawQR(el,text,size){
  if(!el)return;el.innerHTML='';
  if(!window.QRCode){el.innerHTML='<p class="small" style="color:#000;text-align:center">The QR code could not load. Share the link instead.</p>';return}

function bindEnd(){
  const upd=()=>{
    if(!S.payload)return;
    S.payload.issues=[...document.querySelectorAll('.issue:checked')].map(x=>x.value);
    S.payload.issueOther=($('#issueOther').value||'').trim().slice(0,120);
    S.code=S.payload.v===1?'HTT1.'+b64(JSON.stringify(S.payload)):encodeCode(S.payload);
    store.set('htt-last',S.code);store.set('htt-lastp',JSON.stringify(S.payload));
    const t=$('#code');if(t)t.value=S.code;
    const m=$('#copyMsg');if(m)m.textContent='';
    if(SHEET_URL){S.sendState='changed';queueSend();showSend()}
  };
  document.querySelectorAll('.issue').forEach(x=>x.addEventListener('change',upd));
  const o=$('#issueOther');if(o)o.addEventListener('input',upd);
}
async function lockScreen(){try{if(navigator.wakeLock)S.wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseScreen(){try{S.wake&&S.wake.release()}catch(e){}S.wake=null}

function showNotice(m,idx,sample){
  const el=$('#notice');
  el.dataset.idx=idx;el.dataset.sample=sample?'1':'';
  el.innerHTML=`<div class="msg"><div class="avatar">${esc(m.from[0])}</div><div class="body">
    <div class="from">${esc(m.from)}</div><div class="text">${esc(m.text)}</div>
    <div class="replies">${m.replies.map((r,i)=>`<button class="reply" type="button" data-down="reply" data-i="${i}">${esc(r)}</button>`).join('')}</div></div></div>`;
  el.hidden=false;
  try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}
}
function hideNotice(i){const el=$('#notice');if(i!=null&&el.dataset.idx!==String(i))return;el.hidden=true;el.innerHTML=''}
const footTime=now=>(now-S.tc)/1000-cfg().leadIn;

function tick(){
  const c=cfg(),ft=footTime(performance.now()),list=c.schedules[S.schedule];
  list.forEach((m,i)=>{
    const rec=S.msgs[i];
    if(rec.shown==null&&!rec.missed&&ft>=m.t){
      // If the phone was away for the whole time the message was due, it is never shown.
      if(ft>=m.t+c.noticeSeconds){rec.missed=true;rec.skipped=true;saveRun(ft)}
      else{rec.shown=r3(ft);showNotice(m,i,false);saveRun(ft)}
    }
    else if(rec.shown!=null&&rec.replied==null&&!rec.missed&&ft>=m.t+c.noticeSeconds){rec.missed=true;hideNotice(i);saveRun(ft)}
  });
  if(ft-S.lastSave>=2)saveRun(ft);
  if(ft>=c.footageLength+3)finish();
}

function analyseData(mode,schedule,tapTimes,msgs,stoppedAt){
  const c=MODES[mode],w0=c.hitWindow[0],w1=c.hitWindow[1],list=c.schedules[schedule]||[];
  const taps=tapTimes.map((t,k)=>({t:t,k:k})).filter(o=>o.t>=0);
  const used=new Set();
  // If the session stopped early, only hazards that had fully played count.
  const counted=stoppedAt==null?c.hazards:c.hazards.filter(h=>h+w1<=stoppedAt);
  const hazards=counted.map((h,i)=>{
    const withMsg=list.some(m=>h>=m.t&&h<=m.t+c.noticeSeconds);
    const phone=phoneAt(c,schedule,h);
    const hit=taps.find(o=>{const d=o.t-h;return d>=w0&&d<=w1&&!used.has(o.k)});
    if(hit)used.add(hit.k);
    let open=null;
    if(withMsg){
      const r=msgs.find(m=>h>=m.t&&h<=m.t+c.noticeSeconds);
      open=!!(r&&r.shown!=null&&r.shown<=h&&(r.replied!=null?r.replied>h:h<=r.shown+c.noticeSeconds));
    }
    return {i:c.hazards.indexOf(h)+1,h:h,withMsg:withMsg,phone:phone,open:open,found:!!hit,rt:hit?Math.round((hit.t-h)*1000):null};
  });
  let falseAlarms=0,extra=0;
  taps.forEach(o=>{
    if(used.has(o.k))return;
    const inWin=c.hazards.some(h=>{const d=o.t-h;return d>=w0&&d<=w1});
    if(inWin)extra++;else falseAlarms++;
  });
  const grp=f=>{const g=hazards.filter(f),hit=g.filter(z=>z.found);return {total:g.length,found:hit.length,rt:mean(hit.map(z=>z.rt))}};
  const found=hazards.filter(z=>z.found);
  const shown=msgs.filter(m=>m.shown!=null),ans=shown.filter(m=>m.replied!=null);
  return {hazards:hazards,summary:{
    hazardsTotal:hazards.length,found:found.length,falseAlarms:falseAlarms,extraTaps:extra,
    meanRT:mean(found.map(z=>z.rt)),withMsg:grp(z=>z.phone),noMsg:grp(z=>!z.phone),
    msgsShown:shown.length,msgsAnswered:ans.length,
    meanReplyRT:mean(ans.map(m=>(m.replied-m.shown)*1000))
  }};
}

/* Results code, version 2: only the raw taps and message times, in milliseconds, so the code stays
   short. The results tab rescores it with the settings in this file. */
function encodeCode(P){
  const ms=x=>x==null?null:Math.round(x*1000);
  const o={v:2,m:P.mode==='real'?'r':'h',p:P.pid,s:P.schedule,c:P.status==='incomplete'?0:1,k:P.key,
    t:P.taps.map(ms),
    g:P.msgs.map(m=>m.skipped?[-1]:m.shown==null?[]:m.replied==null?[ms(m.shown)]:[ms(m.shown),ms(m.replied),m.ri==null?0:m.ri]),
    l:(P.leftAt||[]).map(ms)};
  if(P.seat)o.st=P.seat;
  if(P.syncLag!=null)o.w=P.syncLag;
  if(P.stoppedAt!=null)o.x=ms(P.stoppedAt);
  if(P.issues&&P.issues.length)o.i=P.issues;
  if(P.issueOther)o.o=P.issueOther;
  if(P.sid)o.id=P.sid;
  return 'HTT1.'+b64u(JSON.stringify(o));
}
function decodeCode(token){
  const p=JSON.parse(unb64(token));
  if(p&&p.v===1&&p.summary)return p;          // codes made by the earlier version
  if(!p||p.v!==2)throw new Error('unknown code');
  const mode=p.m==='r'?'real':'rehearsal',list=MODES[mode].schedules[p.s]||[];
  const sec=x=>x==null?null:x/1000;
  const msgs=list.map((m,i)=>{
    const g=(p.g||[])[i]||[],sk=g[0]===-1,shown=sk?null:sec(g[0]),replied=sk?null:sec(g[1]);
    return {n:i+1,t:m.t,shown:shown,replied:replied,reply:replied!=null?(m.replies[g[2]]||''):null,missed:sk||(shown!=null&&replied==null),skipped:sk};
  });
  const taps=(p.t||[]).map(sec),stoppedAt=p.x==null?null:sec(p.x);
  const a=analyseData(mode,p.s,taps,msgs,stoppedAt);
  return {v:2,mode:mode,pid:p.p,schedule:p.s,seat:p.st||'',syncLag:p.w==null?null:p.w,
    status:p.c?'complete':'incomplete',stoppedAt:stoppedAt,issues:p.i||[],issueOther:p.o||'',
    taps:taps,msgs:msgs,summary:a.summary,
    hazards:a.hazards.map(z=>({i:z.i,h:z.h,m:z.phone?1:0,ms:z.withMsg?1:0,o:z.open==null?null:(z.open?1:0),f:z.found?1:0,rt:z.rt})),
    left:(p.l||[]).length,leftAt:(p.l||[]).map(sec),keyOk:p.k===settingsKey(mode),sid:p.id||'',raw:token};
}
function finish(stoppedAt){
  clearInterval(S.timer);S.timer=null;hideNotice();releaseScreen();
  const early=stoppedAt!=null;
  const payload={v:2,mode:modeKey,pid:S.pid,schedule:S.schedule,seat:S.seat,syncLag:S.syncLag==null?null:r3(S.syncLag),
    status:early?'incomplete':'complete',stoppedAt:early?r3(stoppedAt):null,issues:early?['reload']:[],issueOther:'',
    taps:S.taps.slice(),msgs:S.msgs.map(m=>({shown:m.shown,replied:m.replied,ri:m.ri,skipped:!!m.skipped})),
    leftAt:S.left.slice(),key:settingsKey(modeKey),sid:S.sid||('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7))};
  S.payload=payload;
  S.code=encodeCode(payload);
  store.set('htt-last',S.code);store.set('htt-lastp',JSON.stringify(payload));
  store.del('htt-run');
  S.sendState='';
  go('end');
  if(SHEET_URL){queueSend();sendNow()}   // sends right away; sent again with the checklist answers
}
function resumePartial(){
  let r;try{r=JSON.parse(store.get('htt-run')||'null')}catch(e){r=null}
  if(!r){store.del('htt-run');render();return}
  modeKey=MODES[r.mode]?r.mode:'real';
  S.pid=r.pid;S.schedule=r.schedule;S.seat=r.seat||'';S.syncLag=r.syncLag;
  S.taps=r.taps||[];S.msgs=r.msgs||[];S.left=r.left||[];S.sid=r.sid||'';
  finish(r.lastFt||0);
}

/* ---------------- sending to the Google Sheet ---------------- */
// Each run has its own session id, so the Sheet replaces that run's rows when the same run is sent again.
const HEAD={
  Summary:['session','sent_at','participant','set','seat','design','sync_wait_s','hazards_total','hazards_found','found_phone','total_phone','found_no_phone','total_no_phone','false_alarms','extra_taps','mean_rt_ms','mean_rt_phone_ms','mean_rt_no_phone_ms','msgs_shown','msgs_answered','mean_reply_rt_ms','times_left_page','status','stopped_at_s','problems','code'],
  Hazards:['session','participant','set','hazard','hazard_time_s','phone_condition','msg_on_screen','msg_still_open_at_hazard','found','rt_ms'],
  Messages:['session','participant','set','message','planned_s','shown_s','answered','reply','reply_rt_ms','not_shown_phone_away']
};
const designOf=p=>p.mode==='real'?MODES.real.label:'rehearsal';
function summaryRow(p){const s=p.summary;return [p.pid,p.schedule,p.seat,designOf(p),p.syncLag,s.hazardsTotal,s.found,s.withMsg.found,s.withMsg.total,s.noMsg.found,s.noMsg.total,s.falseAlarms,s.extraTaps,num(s.meanRT),num(s.withMsg.rt),num(s.noMsg.rt),s.msgsShown,s.msgsAnswered,num(s.meanReplyRT),p.left==null?'':p.left,p.status||'complete',p.stoppedAt==null?'':p.stoppedAt,flagsFor(p).join('; ')]}
const hazardRows=p=>p.hazards.map(z=>[p.pid,p.schedule,z.i,z.h,z.m,z.ms==null?z.m:z.ms,z.o,z.f,z.rt]);
const messageRows=p=>p.msgs.map(m=>[p.pid,p.schedule,m.n,m.t,m.shown,m.replied!=null?1:0,m.reply,m.replied!=null&&m.shown!=null?Math.round((m.replied-m.shown)*1000):'',m.skipped?1:0]);
const blank=r=>r.map(v=>v==null?'':v);
function sheetBody(){
  const p=decodeCode(S.code.slice(5)),id=S.payload.sid,at=new Date().toISOString();
  return JSON.stringify({v:1,session:id,headers:HEAD,
    Summary:[blank([id,at].concat(summaryRow(p),[S.code]))],
    Hazards:hazardRows(p).map(r=>blank([id].concat(r))),
    Messages:messageRows(p).map(r=>blank([id].concat(r)))});
}
function queueSend(){if(SHEET_URL&&S.payload&&S.code)store.set('htt-outbox',sheetBody())}
function sendText(){
  return {sending:'Sending...',sent:'Sent. Thank you, you are done.',changed:'You changed your answers. Tap Send again.',
    failed:'Not sent yet. Check that you are online, then tap Send again. If it still fails, show the backup code to a researcher.'}[S.sendState]||'';
}
function showSend(){
  const m=$('#sendMsg');if(m){m.textContent=sendText();m.className='small '+(S.sendState==='sent'?'ok':S.sendState==='sending'?'muted':'err')}
  const b=$('#sendBtn');if(b){b.disabled=S.sendState==='sending';b.textContent=S.sendState==='sent'?'Sent':'Send my results'}
}
async function sendNow(){
  const body=store.get('htt-outbox');if(!SHEET_URL||!body)return false;
  S.sendState='sending';showSend();
  let ok=false;
  for(let tryNo=0;tryNo<3&&!ok;tryNo++){
    try{
      const r=await fetch(SHEET_URL,{method:'POST',body:body});   // plain text body, no extra headers
      const j=await r.json();ok=!!(j&&j.ok);
    }catch(e){}
    if(!ok)await sleep(1500);
  }
  if(ok&&store.get('htt-outbox')===body)store.del('htt-outbox');
  if(S.screen==='end'){S.sendState=ok?'sent':'failed';showSend()}
  return ok;
}

async function copyText(text,ta,msgEl){

/* ---------------- host flow ---------------- */
let hostRunId=0,audio=null,videoURL=null;
function getAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();return audio}catch(e){return null}}
function tone(f,d){
  const ac=getAudio();if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}
const stage=$('#stage'),vid=$('#vid'),cv=$('#cv'),stageText=$('#stageText');
function stageSet(bg,html){stage.style.background=bg;stageText.innerHTML=html||''}

function drawRoad(ctx,w,h,ft,c){
  const hz=h*.42;
  ctx.fillStyle='#223044';ctx.fillRect(0,0,w,hz);
  ctx.fillStyle='#1d2a1f';ctx.fillRect(0,hz,w,h-hz);
  ctx.fillStyle='#3a3f47';ctx.beginPath();
  ctx.moveTo(w*.47,hz);ctx.lineTo(w*.53,hz);ctx.lineTo(w*.92,h);ctx.lineTo(w*.08,h);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d9d4b8';
  const phase=(ft*.9)%1;
  for(let k=0;k<9;k++){
    const z0=(k+phase)/9,z1=(k+phase+.5)/9;
    const y0=hz+(h-hz)*z0*z0,y1=hz+(h-hz)*z1*z1,w0=2+z0*26,w1=2+z1*26;
    ctx.beginPath();ctx.moveTo(w/2-w0/2,y0);ctx.lineTo(w/2+w0/2,y0);ctx.lineTo(w/2+w1/2,y1);ctx.lineTo(w/2-w1/2,y1);ctx.closePath();ctx.fill();
  }
  const hit=c.hazards.findIndex(x=>ft>=x&&ft<=x+2.5);
  if(hit>=0){
    const p=(ft-c.hazards[hit])/2.5,s=.35+.65*p,cx=w/2+(hit%2?-1:1)*w*.08*s,cy=hz+(h-hz)*(.25+.5*p),sz=h*.16*s;
    ctx.fillStyle='#e5484d';ctx.beginPath();ctx.moveTo(cx,cy-sz);ctx.lineTo(cx+sz*.9,cy+sz*.7);ctx.lineTo(cx-sz*.9,cy+sz*.7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold '+Math.round(sz*.9)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',cx,cy+sz*.15);
  }
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='16px system-ui';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText('Placeholder footage for rehearsal',16,h-16);
}

function hostFinish(id,delay){
  if(id!==hostRunId)return;
  try{vid.pause()}catch(e){}
  if(delay!=null)logSession({delay:delay});
  vid.hidden=true;cv.hidden=true;
  stageSet('#000',`<h2 style="font-size:2rem">Footage finished</h2><p>Phones finish on their own a few seconds later.</p>
    ${delay!=null?`<p style="opacity:.7">The video started ${Math.round(delay)} ms after its planned time. Write this number down.</p>`:''}
    <button class="btn primary" data-act="hostStop">Back to controls</button>`);
}

async function hostStart(){
  const id=++hostRunId,c=cfg();
  S.vidLive=false;
  if(videoURL){
    // Start and pause the video right away (muted), while the click still counts as a user action.
    try{vid.muted=true;const pr=vid.play();
      if(pr&&pr.then)pr.then(()=>{if(!S.vidLive){vid.pause();try{vid.currentTime=0}catch(e){}}vid.muted=false}).catch(()=>{vid.muted=false})}catch(e){vid.muted=false}
  }
  vid.hidden=true;cv.hidden=true;stage.hidden=false;
  try{if(stage.requestFullscreen)await stage.requestFullscreen()}catch(e){}
  getAudio();try{if(audio&&audio.state==='suspended')audio.resume()}catch(e){}
  for(let n=5;n>=1;n--){
    if(id!==hostRunId)return;
    stageSet('#000',`<div class="count">${n}</div><p style="font-size:1.4rem">Phones ready? Tap your button when the screen flashes white.</p>`);
    tone(440,.08);await sleep(1000);
  }
  if(id!==hostRunId)return;
  logSession(null,{at:new Date().toISOString(),mode:modeKey,footage:videoURL?(S.fileName||'video file'):'placeholder road',delay:null,stopped:false});
  const t0=performance.now();
  stageSet('#fff','<div class="cue">TAP NOW</div>');tone(880,.4);
  await sleepUntil(t0+1200);if(id!==hostRunId)return;
  stageSet('#000','<p style="font-size:1.6rem;opacity:.8">Get ready</p>');
  const plan=t0+c.leadIn*1000;
  await sleepUntil(plan);if(id!==hostRunId)return;
  if(videoURL){
    stageText.innerHTML='';vid.hidden=false;S.vidLive=true;vid.muted=false;
    if(vid.currentTime>0.05){try{vid.currentTime=0}catch(e){}}
    vid.onended=()=>hostFinish(id,null);
    vid.onplaying=()=>{vid.onplaying=null;hostFinish.delay=performance.now()-plan};
    vid.onended=()=>hostFinish(id,hostFinish.delay);
    try{await vid.play()}catch(e){
      stageSet('#000','<p style="font-size:1.4rem">The video would not start by itself.</p><button class="btn primary" data-act="hostStop">Back to controls</button>');
    }
  }else{
    stageText.innerHTML='';cv.hidden=false;
    cv.width=stage.clientWidth||innerWidth;cv.height=stage.clientHeight||innerHeight;
    const ctx=cv.getContext('2d');
    (function frame(){
      if(id!==hostRunId)return;
      const ft=(performance.now()-plan)/1000;
      if(ft>=c.footageLength){hostFinish(id,null);return}
      drawRoad(ctx,cv.width,cv.height,ft,c);requestAnimationFrame(frame);
    })();
  }
}
/* Sessions started on this laptop: logSession(null, entry) adds one; logSession(changes) updates the latest. */
function logSession(changes,entry){
  const list=loadJSON('htt-sessions',[]);
  if(entry)list.push(entry);else if(list.length)Object.assign(list[list.length-1],changes);
  store.set('htt-sessions',JSON.stringify(list.slice(-30)));
}

/* ---------------- host: collecting results ---------------- */
function pooled(){
  let wmT=0,wmF=0,nmT=0,nmF=0;const wr=[],nr=[];
  collected.forEach(p=>{const s=p.summary;wmT+=s.withMsg.total;wmF+=s.withMsg.found;nmT+=s.noMsg.total;nmF+=s.noMsg.found;
    p.hazards.forEach(z=>{if(z.f&&z.rt!=null)(z.m?wr:nr).push(z.rt)})});
  const f=(F,T,R)=>`${F} of ${T} found (${T?Math.round(100*F/T):0}%)${R.length?', mean RT '+Math.round(mean(R))+' ms':''}`;
  return {wm:f(wmF,wmT,wr),nm:f(nmF,nmT,nr)};
}
/* "1-16, 18" -> [1..16, 18] */
function parseExpected(s){
  const out=new Set();
  String(s||'').split(/[,\s]+/).forEach(part=>{
    const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)return;
    const a=Number(m[1]),b=m[2]?Number(m[2]):a;
    for(let n=Math.min(a,b);n<=Math.max(a,b)&&n<=99;n++)if(n>=1)out.add(n);
  });
  return [...out].sort((x,y)=>x-y);
}
function flagsFor(p){
  const f=[],s=p.summary;
  if(p.status==='incomplete')f.push('stopped early at '+Math.round(p.stoppedAt||0)+' s');
  if(p.left)f.push('phone left the page '+p.left+(p.left===1?' time':' times'));
  (p.issues||[]).forEach(k=>{const t=ISSUE_SHORT[k];if(t&&!(k==='reload'&&p.status==='incomplete')&&!(k==='away'&&p.left))f.push('reported: '+t)});
  if(p.issueOther)f.push('said: '+p.issueOther);
  if(!(p.taps||[]).some(t=>t>=0))f.push('no taps recorded');
  if(p.keyOk===false)f.push('code was made with different timings than this page');
  if(s.msgsShown&&s.msgsAnswered===0)f.push('answered no messages');
  if(p.mode!=='real')f.push('used rehearsal timings');
  return f;
}
function sessionLog(){
  const expected=parseExpected(store.get('htt-expected'));
  const byPid={};collected.forEach(p=>byPid[p.pid]=p);
  const all=[...new Set(expected.concat(collected.map(p=>p.pid)))].sort((a,b)=>a-b);
  const rows=all.map(pid=>{
    const p=byPid[pid];
    if(!p)return {pid:pid,status:'no code',flags:['no results received']};
    const extra=expected.length&&!expected.includes(pid)?['number was not on the handed-out list']:[];
    return {pid:pid,status:p.status==='incomplete'?'stopped early':'complete',flags:flagsFor(p).concat(extra)};
  });
  return {expected:expected,rows:rows,
    complete:collected.filter(p=>p.status!=='incomplete').length,
    incomplete:collected.filter(p=>p.status==='incomplete').length,
    missing:rows.filter(r=>r.status==='no code').map(r=>r.pid),
    flagged:rows.filter(r=>r.status!=='no code'&&r.flags.length).map(r=>r.pid)};
}
function addCode(raw){
  // Accepts codes copied from the phone, or a whole column copied from the Sheet (quotes, commas, %2B and so on).
  raw=String(raw||'').replace(/%([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
  const parts=raw.split('HTT1.').slice(1);
  if(!parts.length)return {ok:false,msg:'That does not look like a results code. It should start with HTT1.'};
  const msgs=[];let ok=true;
  parts.forEach(chunk=>{
    const token=(chunk.match(/^[A-Za-z0-9+\/=_-]+/)||[''])[0];let p;
    try{p=decodeCode(token)}catch(e){ok=false;msgs.push('One code is incomplete or not recognised. Ask for it to be copied again.');return}
    if(!p||p.pid==null){ok=false;msgs.push('One code was not recognised.');return}
    const i=collected.findIndex(x=>x.pid===p.pid);
    if(i>=0){collected[i]=p;msgs.push('Participant '+p.pid+' was already listed, so it was replaced.')}
    else{collected.push(p);msgs.push('Added participant '+p.pid+'.')}
  });
  saveCollected();return {ok:ok,msg:msgs.join(' ')};
}
const cell=v=>{if(v==null)return '';const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(cell).join(',')).join('\n');
function csvFor(k){
  const P=collected.slice().sort((a,b)=>a.pid-b.pid);
  if(k==='summary')return toCSV([['participant','set','seat','design','sync_wait_s','hazards_total','hazards_found','found_phone','total_phone','found_no_phone','total_no_phone','false_alarms','extra_taps','mean_rt_ms','mean_rt_phone_ms','mean_rt_no_phone_ms','msgs_shown','msgs_answered','mean_reply_rt_ms','times_left_page','status','stopped_at_s','problems']]
    .concat(P.map(summaryRow)));
  if(k==='hazards')return toCSV([['participant','set','hazard','hazard_time_s','phone_condition','msg_on_screen','msg_still_open_at_hazard','found','rt_ms']]
    .concat([].concat.apply([],P.map(hazardRows))));
  if(k==='messages')return toCSV([['participant','set','message','planned_s','shown_s','answered','reply','reply_rt_ms','not_shown_phone_away']]
    .concat([].concat.apply([],P.map(messageRows))));
  if(k==='log'){
    const notes=loadJSON('htt-notes',{});
    return toCSV([['participant','status','problems','researcher_notes']].concat(sessionLog().rows.map(r=>[r.pid,r.status,r.flags.join('; '),notes[r.pid]||''])));
  }
  return toCSV([['participant','set','tap_time_s']].concat([].concat.apply([],P.map(p=>p.taps.map(t=>[p.pid,p.schedule,t])))));
}

const act={

  frontGo(){

  },

  csv(b){const t=csvFor(b.dataset.k),ta=$('#csvOut');ta.value=t;copyText(t,ta,$('#csvMsg'))},

};
const down={
  practiceTap(){S.practice++;const e=$('#pc');if(e)e.textContent=S.practice},
  syncTap(){

};
